<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost among the stars · STAROT</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Marcellus&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--void:#050609;--gold:#d8b877;--gold-dim:#8f7b52;--bone:#e9e2d2}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--void);color:var(--bone);font-family:'Jost',sans-serif;font-weight:300;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    background-image:radial-gradient(1px 1px at 20% 30%,rgba(233,226,210,.6),transparent),
      radial-gradient(1px 1px at 70% 20%,rgba(233,226,210,.5),transparent),
      radial-gradient(1px 1px at 40% 80%,rgba(216,184,119,.5),transparent),
      radial-gradient(1px 1px at 85% 65%,rgba(233,226,210,.4),transparent),
      radial-gradient(ellipse 110% 100% at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
  .brand{font-family:'Marcellus',serif;letter-spacing:.42em;font-size:15px;display:inline-flex;align-items:center;gap:11px;margin-bottom:40px}
  .brand i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
  .code{font-family:'Marcellus',serif;font-size:64px;letter-spacing:.2em;color:var(--gold)}
  p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;margin:14px 0}
  p.pt{color:var(--gold-dim)}
  nav{margin-top:36px;display:flex;gap:28px;justify-content:center}
  a{color:var(--gold);text-decoration:none;letter-spacing:.2em;font-size:13px;text-transform:uppercase;border-bottom:1px solid var(--gold-dim);padding-bottom:4px}
  a:hover{color:var(--bone)}
</style>
</head>
<body>
<main>
  <div class="brand"><i></i>STAROT</div>
  <div class="code">404</div>
  <p>This page is lost among the stars.</p>
  <p class="pt" lang="pt-BR">Esta página se perdeu entre as estrelas.</p>
  <nav><a href="https://starot.one/">English</a><a href="https://starot.one/pt/" lang="pt-BR">Português</a></nav>
</main>
</body>
</html>
